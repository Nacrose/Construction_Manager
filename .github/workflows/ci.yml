name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24 # match the locally verified environment
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ratcheted: warnings may only DECREASE)
        # Ratchet: 950 warnings as of 2026-08-30. Lower this number when you
        # fix warnings — never raise it. (The previous cap of 10000 let every
        # warning pass silently, making the gate decorative.)
        run: npx eslint . --max-warnings 950

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          # Build must succeed WITHOUT secrets — the app fails loudly at
          # runtime when AUTH_SECRET is missing, but the build itself stays
          # environment-independent.
          NEXT_TELEMETRY_DISABLED: "1"
          # Sentry source-map upload — inert unless the three secrets are
          # configured on the repo (no DSN → SDK no-ops at runtime too).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: npm run build

  rls:
    name: RLS integration gate (scratch Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rls
          POSTGRES_PASSWORD: rls
          POSTGRES_DB: rls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rls"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: RLS integration + full-stack smoke tests (migrations + tenant isolation + router flow)
        env:
          TEST_DATABASE_URL: postgresql://rls:rls@localhost:5432/rls_test
        run: |
          npx vitest run src/server/routers/__tests__/rls-integration.test.ts
          npx vitest run src/server/routers/__tests__/smoke-flow.test.ts
