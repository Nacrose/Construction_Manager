name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24 # match the locally verified environment
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit gate
        # Fails the build on known high/critical CVEs in the dependency
        # graph. Dependabot (see .github/dependabot.yml) opens the fix PRs.
        run: npm audit --audit-level=high

      - name: "Lint ratchet (warnings may only decrease)"
        # Ratchet: 1200 warnings baseline with architectural engine fences active.
        run: npx eslint . --max-warnings 1200


      - name: Typecheck
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          # Build must succeed WITHOUT secrets — the app fails loudly at
          # runtime when AUTH_SECRET is missing, but the build itself stays
          # environment-independent.
          NEXT_TELEMETRY_DISABLED: "1"
          # next build's "Running TypeScript" step spawns its own worker;
          # without an explicit heap ceiling it can die silently on big
          # graphs ("Failed to type check." with no error printed). Same
          # convention the local verification workflow already uses for
          # tsc on this codebase.
          NODE_OPTIONS: "--max-old-space-size=6144"
          # Sentry source-map upload — inert unless the three secrets are
          # configured on the repo (no DSN → SDK no-ops at runtime too).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: npm run build

  rls:
    name: RLS integration gate (scratch Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rls
          POSTGRES_PASSWORD: rls
          POSTGRES_DB: rls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rls"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: RLS integration + full-stack smoke tests (migrations + tenant isolation + router flow)
        env:
          TEST_DATABASE_URL: postgresql://rls:rls@localhost:5432/rls_test
        run: |
          npx vitest run src/server/routers/__tests__/rls-integration.test.ts
          npx vitest run src/server/routers/__tests__/smoke-flow.test.ts

  e2e:
    name: Browser E2E (Playwright, production build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium-headless-shell

      - name: Run E2E pipeline (migrate → seed → build → start → test)
        env:
          E2E_DATABASE_URL: postgresql://e2e:e2e@localhost:5432/e2e_test
        run: python3 scripts/e2e-run.py

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
