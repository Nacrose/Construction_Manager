name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24 # match the locally verified environment
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (errors only)
        run: npx eslint . --max-warnings 10000

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          # Build must succeed WITHOUT secrets — the app fails loudly at
          # runtime when AUTH_SECRET is missing, but the build itself stays
          # environment-independent.
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
