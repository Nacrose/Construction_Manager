name: Cron

# Scheduled background jobs for the production deployment.
#
# WHY GITHUB ACTIONS INSTEAD OF vercel.json `crons`
# Vercel's Hobby plan only allows cron schedules of once per day — a
# vercel.json with `*/5 * * * *` or `0 * * * *` makes EVERY deployment fail
# validation before a build even starts (commit status "Deployment failed."
# linking to vercel.com/docs/cron-jobs/usage-and-pricing). The repo is
# public, so Actions minutes are free and the same Bearer-token contract is
# preserved. If this project ever moves to Vercel Pro, these schedules can
# move back into vercel.json `crons` and this workflow retired.
#
# RELIABILITY NOTES
# - GitHub Actions scheduled workflows can be delayed several minutes
#   during peak load windows. The outbox dispatch is designed for this:
#   rows are claimed via per-row CAS (no double delivery), stuck rows are
#   reaped on the next tick, and batches drain until empty — delayed or
#   overlapping ticks are safe, only the delivery latency grows.
# - Schedules only run from the default branch, in UTC.
# - Manual trigger: Actions → Cron → Run workflow (runs both jobs once).

on:
  schedule:
    # Outbox delivery pass — every 5 minutes.
    - cron: "*/5 * * * *"
    # Invariant probes (GL trial balance, RLS tenant isolation) — hourly.
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: cron-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  outbox:
    name: Outbox dispatch (every 5 min)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
    steps:
      - name: Preflight — required repo secrets
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          missing=""
          [ -z "$SITE_URL" ] && missing="$missing SITE_URL"
          [ -z "$CRON_SECRET" ] && missing="$missing CRON_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing"
            echo "Set them under Settings → Secrets and variables → Actions."
            echo "SITE_URL = production origin, e.g. https://your-app.vercel.app"
            echo "CRON_SECRET = same value as the CRON_SECRET env var on Vercel"
            exit 1
          fi
      - name: Invoke /api/cron/outbox
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w '\nHTTP %{http_code} in %{time_total}s\n' \
            "$SITE_URL/api/cron/outbox"

  invariants:
    name: Invariant probes (hourly)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * *'
    steps:
      - name: Preflight — required repo secrets
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          missing=""
          [ -z "$SITE_URL" ] && missing="$missing SITE_URL"
          [ -z "$CRON_SECRET" ] && missing="$missing CRON_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing"
            echo "Set them under Settings → Secrets and variables → Actions."
            echo "SITE_URL = production origin, e.g. https://your-app.vercel.app"
            echo "CRON_SECRET = same value as the CRON_SECRET env var on Vercel"
            exit 1
          fi
      - name: Invoke /api/cron/invariants
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w '\nHTTP %{http_code} in %{time_total}s\n' \
            "$SITE_URL/api/cron/invariants"
